name: Matrix Mod Tests

on:
  # Every 28th of the month at midnight
  schedule:
    - cron: "0 0 28 * *"
  # Manually triggered
  workflow_dispatch:

jobs:
  matrix-mod-tests:
    runs-on: ubuntu-latest
    env:
      GMP_INCDIR: /usr/include
      GMP_CXX_LINK: "-lm -lgmp -lgmpxx"
      BOOST_INCDIR: "/usr/include"
      BOOST_LINK: "/usr/lib/x86_64-linux-gnu/libboost_serialization.a"
      EIGEN_PATH: /home/runner/work/opt/eigen

    steps:
    - uses: actions/checkout@v4

    - name: Install standard dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgmp-dev libeigen3-dev libboost-all-dev

    - name: Install non-standard dependencies
      run: |
        mkdir -p /home/runner/work/opt
        # We need specific version 3.3.9 because of a bug in 3.4.0 for algebraic data types.
        wget -q https://gitlab.com/libeigen/eigen/-/archive/3.3.9/eigen-3.3.9.tar.gz
        tar -xzf eigen-3.3.9.tar.gz
        mv eigen-3.3.9 /home/runner/work/opt/eigen
        pwd
        echo "After eigen-3.3.9 set up"

    # The modular matrix operations of MAT_MatrixMod.h, and the
    # membership in a space modulo p of RecSolutionMatMod in particular,
    # from CI_tests/MatrixMod. The script builds Test_MatrixMod itself
    # and runs it for three arithmetics; the program decides every
    # membership twice, once through the structure and once through the
    # rank, and reports its own failures. Set MATRIXMOD_QUICK=1 to try
    # fewer spaces per modulus.
    - name: Test_MatrixMod
      run: ./CI_tests/MatrixMod/run_test.sh
